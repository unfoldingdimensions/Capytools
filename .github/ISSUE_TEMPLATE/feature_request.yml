name: Feature request
description: An idea for the editor, the templates, or the exports
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are actually in. "I keep retyping the same bullet at a different length" beats "add an AI feature".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this respects
      description: These three are not up for negotiation — see CONTRIBUTING.md.
      options:
        - label: It adds no tracking, no account and no server call.
          required: true
        - label: It does not gate anything that is free today.
          required: true
        - label: It does not require a claim the code cannot support.
          required: true

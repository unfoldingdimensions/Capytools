# The suite carries the security tables (SSRF blocklist, request gates,
# sanitizer contracts) — they only protect the site if they actually run.
# Prod dependencies are audited at high; dev-only advisory chains (shadcn,
# eslint tooling) are tracked but do not gate.
#
# Deploy jobs sit behind `test`, so a red suite cannot reach Cloudflare. Both
# build steps set NEXT_PUBLIC_SITE_URL: it is inlined at BUILD time, and
# leaving it unset silently ships share URLs pointing at the wrong host — a
# Worker secret cannot fix that after the fact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first deploy irrelevant. Let it go
# rather than racing it to Cloudflare.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://capytools.app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      # `LayoutProps` and friends are generated into .next/types, so a clean
      # checkout has to generate them before tsc can see them. typegen does
      # that without paying for a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high

  # Every PR gets a real Worker on a versioned URL. `versions upload` stages a
  # version WITHOUT moving production to it, so main keeps serving whatever it
  # was serving.
  preview:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # CapyBg's model/runtime assets (~150 MB) are downloaded, verified and
      # sharded at build time. These steps must be explicit: the build below
      # calls opennextjs-cloudflare directly, which bypasses npm's prebuild.
      # A Hugging Face outage fails here loudly instead of deploying a CapyBg
      # with no model behind it.
      - name: Restore CapyBg assets
        uses: actions/cache@v4
        with:
          path: public/capybg
          key: capybg-${{ runner.os }}-${{ hashFiles('src/lib/capybg/models.ts', 'package.json') }}
      - name: Fetch CapyBg assets
        run: npx tsx scripts/fetch-capybg-assets.ts
      - name: Verify CapyBg assets
        run: npx tsx scripts/fetch-capybg-assets.ts --verify-only
      - run: npx opennextjs-cloudflare build
      # No --env-file here: .env.cloudflare is a local-only convenience and does
      # not exist in CI. The token arrives as an environment variable instead.
      - run: npx wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Same as preview: the assets must exist before the Worker build packs
      # them, and opennextjs-cloudflare bypasses prebuild.
      - name: Restore CapyBg assets
        uses: actions/cache@v4
        with:
          path: public/capybg
          key: capybg-${{ runner.os }}-${{ hashFiles('src/lib/capybg/models.ts', 'package.json') }}
      - name: Fetch CapyBg assets
        run: npx tsx scripts/fetch-capybg-assets.ts
      - name: Verify CapyBg assets
        run: npx tsx scripts/fetch-capybg-assets.ts --verify-only
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The gate that matters: a green build that serves a broken site is still
      # a broken site. This is what caught /license returning 500 on Workers.
      - name: Smoke the deployment
        run: node scripts/smoke.mjs "${{ vars.DEPLOY_URL || 'https://capytools.app' }}"
      # Only after the smoke passes, so engines are never sent to a broken
      # version. The production host, never DEPLOY_URL: IndexNow refuses URLs
      # whose host doesn't own the key. Non-blocking — the deploy already
      # happened, and a search engine's outage must not turn main red.
      # Only URLs that changed since the last SUCCESSFUL submission are sent
      # (D49): that sitemap lives in the cache, and a failed or skipped ping
      # leaves it alone, so pages from a deploy whose smoke failed still go
      # out with the next one. No cache yet means everything is sent once.
      - name: Restore the last submitted sitemap
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/last-sitemap.xml
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Ping IndexNow
        id: indexnow
        continue-on-error: true
        run: node scripts/indexnow.mjs https://capytools.app .indexnow/last-sitemap.xml
      - name: Remember the submitted sitemap
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .indexnow/last-sitemap.xml
          key: indexnow-${{ github.run_id }}

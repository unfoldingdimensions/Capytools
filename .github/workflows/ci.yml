# The gate that `npm run lint` was always supposed to have.
#
# This repo once shipped `.github/workflows/ci.yml` (added in the initial
# commit) and lost it in a pre-pivot style commit, so for a long stretch
# nothing enforced the checks the README tells contributors to run. Every step
# below is a script that already exists in package.json — this only makes them
# run on every push and pull request instead of trusting that someone did.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Forks and dependabot-style PRs only need read access to run the checks.
permissions:
  contents: read

# A second push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Matches the version this was developed and verified on. package.json's
      # `engines` records >=20.9 because that is the floor Next 16 itself
      # declares — below it, install and build fail outright.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Cheapest and most mechanical first, so a formatting slip fails in
      # seconds rather than after a full build. Note `format:check`, never
      # `format` — the latter is `prettier --write` and would dirty the tree
      # instead of failing.
      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      # `--max-warnings=0`: a stray console.log in product code fails here too.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Renders a real PDF through @react-pdf/renderer and asserts its text
      # layer. Independent of `next build` — it compiles lib/capyresume itself
      # into a cache directory.
      - name: Verify the PDF text layer
        run: npm run verify:pdf

      - name: Build
        run: npm run build

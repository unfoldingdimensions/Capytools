<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CapyResume — social card (authored source; captured to app/opengraph-image.png)</title>
    <!--
      The social card, authored rather than generated at request time. It is exactly
      1200x630 and captures to a static PNG, which keeps next/og's runtime font fetch
      out of the build. Fonts come from the Google CDN here only because this file is a
      capture source, never a shipped page; the site itself self-hosts via next/font.

      Palette and type come from DESIGN.md: cream canvas, sage mark, Fraunces headline
      at light 300 with one italic word, Albert Sans for the label voice.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Albert+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Albert Sans', system-ui, sans-serif;
      }

      .card {
        position: relative;
        display: block;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f9f9f7;
        color: #1a1a1a;
      }

      /* The same gradient-wash technique as the site's ambient layer: radial gradients,
         never a blur filter, so nothing has to re-sample a backdrop. */
      .wash {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .wash-a {
        top: -360px;
        left: -240px;
        width: 820px;
        height: 820px;
        opacity: 0.2;
        background: radial-gradient(closest-side, #7a8e6e, rgba(122, 142, 110, 0));
      }

      .wash-b {
        right: -260px;
        bottom: -320px;
        width: 740px;
        height: 740px;
        opacity: 0.24;
        background: radial-gradient(closest-side, #c2b2a3, rgba(194, 178, 163, 0));
      }

      .inner {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        padding: 66px 80px;
      }

      .eyebrow {
        margin: 0;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #6b6963;
      }

      h1 {
        max-width: 960px;
        margin: 26px 0 0;
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 300;
        font-size: 88px;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }

      h1 em {
        font-style: italic;
      }

      .lead {
        max-width: 900px;
        margin: 26px 0 0;
        font-size: 29px;
        line-height: 1.45;
        color: #4a4843;
      }

      .rule {
        height: 1px;
        margin-top: auto;
        background: #e7e4dd;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 26px;
      }

      .mark {
        width: 54px;
        height: 40px;
        color: #8e9b7e;
      }

      .wordmark {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 33px;
        font-weight: 400;
      }

      .note {
        margin-left: auto;
        font-size: 21px;
        color: #6b6963;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wash wash-a"></div>
      <div class="wash wash-b"></div>
      <div class="inner">
        <p class="eyebrow">free &middot; no account &middot; open source</p>
        <h1>A CV that&rsquo;s <em>actually</em> yours.</h1>
        <p class="lead">
          Twelve single-column templates, PDF and DOCX export, and nothing that ever leaves your
          browser tab.
        </p>
        <div class="rule"></div>
        <div class="foot">
          <svg class="mark" viewBox="0 0 64 48" fill="none" aria-hidden="true">
            <path
              d="M15 25 C15 13 22 7 32 7 C42 7 49 13 49 25 C49 34 42 40 32 40 C24 40 15 34 15 25 Z"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M23 20 h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            <path d="M34 20 h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            <path
              d="M22 8.5 Q24 3 28 5"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              d="M42 8.5 Q40 3 36 5"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              d="M18 41 q5 3 10 0 M36 41 q5 3 10 0"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              opacity="0.5"
            />
          </svg>
          <span class="wordmark">CapyResume</span>
          <span class="note">a r&eacute;sum&eacute; builder that runs in your browser</span>
        </div>
      </div>
    </div>
  </body>
</html>

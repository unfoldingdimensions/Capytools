name: Bug report
description: Something in the editor, a template, or an export is wrong
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real résumé data. A made-up name and one line of fake
        history reproduces almost any bug here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in plain terms.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the demo data
        2. Switch to the Executive template
        3. Press Download PDF
        4. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it happens
      description: The URL, or "local build" with the commit if you are running it yourself.
      placeholder: https://capyresume.com/capyresume
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 141 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything the browser console printed. Paste it as text, not a screenshot.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This report contains no real résumé data.
          required: true
        - label: I checked the browser console and included anything relevant.
          required: true
        - label: I am not reporting a security vulnerability here (those go through the private form).
          required: true
